# Full stack: nginx -> (frontend, backend) -> MySQL.
#   cp .env.example .env   # then set real passwords
#   docker compose up --build
# App: http://localhost:${HOST_PORT:-80}

# Docker keeps a container's logs forever by default, so they'd slowly fill
# the disk. Each container keeps at most 5 files of 10 MB, oldest dropped.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mealdeck
      MYSQL_USER: ${DB_USERNAME:-mealdeck}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Kolkata
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1, not localhost: localhost goes over the unix socket, which
      # the entrypoint's temporary init server (started with networking off)
      # also answers on, so a fresh volume reported healthy before the real
      # server accepted TCP and the backend's first connect was refused.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    image: mealdeck-backend
    restart: unless-stopped
    logging: *logging
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-mealdeck}
      DB_PASSWORD: ${DB_PASSWORD}
      # Sign-up emails; see .env.example. Empty key = codes go to the log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-MealDeck <noreply@mealdeck.in>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_REAL_EMAIL: ${ADMIN_REAL_EMAIL:-}
      # Accounts the deletion flow never deletes (demo student, Play
      # reviewers), comma-separated; also left out of the pitch numbers.
      ACCOUNT_DELETION_PROTECTED: ${ACCOUNT_DELETION_PROTECTED:-student@bennett.edu.in}
      # Your own test logins, left out of the admin Overview's pitch numbers.
      PITCH_TEST_ACCOUNTS: ${PITCH_TEST_ACCOUNTS:-}
      MEALDECK_UPLOAD_DIR: /app/uploads
      # One JSON object per log line (Elastic Common Schema), so logs can be
      # searched by level, logger or message. Set here, not in
      # application.properties, so ./run.sh and the tests keep plain text.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
    image: mealdeck-frontend
    restart: unless-stopped
    logging: *logging
    environment:
      # Read at request time by the server component that loads the menu.
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      # The folder, not the single file: a file bind mount pins the inode it
      # started with, so a deploy that rewrites nginx.conf left nginx on the
      # old config. A folder mount sees the new file; the deploy job then
      # reloads nginx (see .github/workflows/deploy.yml).
      - ./nginx:/etc/nginx/conf.d:ro
    # 127.0.0.1, not localhost: busybox wget may try IPv6 first, and nginx
    # only listens on IPv4.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
