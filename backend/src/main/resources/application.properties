spring.application.name=mealdeck

# DB_HOST is `mysql` inside docker-compose; defaults to localhost for ./run.sh.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:mealdeck}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:mealdeck}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logins are kept in the database (Spring Session JDBC), so restarting the
# backend -- every deploy, every reboot -- no longer logs everyone out.
# "always" creates the SPRING_SESSION tables on MySQL too (Boot only does it
# for in-memory databases by default); on later starts the CREATE TABLEs
# fail harmlessly, since spring.session.jdbc.continue-on-error defaults to
# true. A login still expires after 30 idle minutes, as before.
spring.session.jdbc.initialize-schema=always

# Render ResponseStatusException reasons ("The 12:30 slot just filled up")
# as an RFC 9457 problem+json body with a `detail` field the frontend can
# show, instead of Boot's default error body, which hides the reason.
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
mealdeck.upload-dir=${MEALDECK_UPLOAD_DIR:uploads}

# Pages allowed to open the live-queue socket (/api/ws). Comma-separated
# origin patterns: the public site, local dev, and the ProLiant over
# Tailscale (its IP, short MagicDNS name and full *.ts.net name). Override
# the whole list with WS_ALLOWED_ORIGINS. Without a match the page still
# works, it just falls back to its slower refresh.
mealdeck.ws.allowed-origins=${WS_ALLOWED_ORIGINS:https://mealdeck.in,http://localhost:*,http://127.0.0.1:*,http://100.122.77.124:*,http://rgproliant:*,http://rgproliant.*.ts.net:*}

# Sign-up codes are emailed through Resend. With no key (or the
# "<resend api key>" placeholder) they're written to the log instead.
mealdeck.mail.resend-api-key=${RESEND_API_KEY:}
mealdeck.mail.from=${MAIL_FROM:MealDeck <noreply@mealdeck.in>}

# Accounts that can try "Delete my account" but are never actually deleted
# (comma-separated emails), e.g. the Google Play reviewers' test login.
mealdeck.account.deletion-protected=${ACCOUNT_DELETION_PROTECTED:student@bennett.edu.in}

# The admin login (see AdminBootstrap): no password, each login is a code
# emailed to ADMIN_REAL_EMAIL. Password login for admins is demo-only.
mealdeck.admin.email=${ADMIN_EMAIL:}
mealdeck.admin.real-email=${ADMIN_REAL_EMAIL:}
mealdeck.admin.password-login=false
