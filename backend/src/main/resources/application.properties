spring.application.name=mealdeck

spring.datasource.url=jdbc:mysql://localhost:3306/mealdeck?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:mealdeck}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
