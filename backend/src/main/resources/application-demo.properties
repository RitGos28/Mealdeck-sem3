spring.datasource.url=jdbc:h2:mem:mealdeck;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Local runs and tests: the demo admin (admin123) can still log in with its password.
mealdeck.admin.password-login=true

# Local demos: DEMO_HISTORY=true fills the database with SIMULATED orders,
# votes and Deal swipes (DemoHistorySeeder), and the app shows a banner
# saying so. DEMO_MENU_DIR loads every stall's menu CSV first.
mealdeck.demo.history=${DEMO_HISTORY:false}
mealdeck.demo.menu-dir=${DEMO_MENU_DIR:}
