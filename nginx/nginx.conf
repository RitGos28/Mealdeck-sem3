# The only service with a published port. Everything else (frontend,
# backend, MySQL) is reachable only on the compose network.

# WebSocket upgrade for the live queue (/api/ws): pass the browser's
# Upgrade header through, and send "Connection: upgrade" only when it asked.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One JSON object per request, so the logs can be searched and counted (week
# 8's bug hunt starts here). Every request arrives through the Cloudflare
# tunnel, so $remote_addr is the tunnel node; the visitor's real address is
# Cloudflare's CF-Connecting-IP header.
log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"client_ip":"$http_cf_connecting_ip",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_s":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log json;

    client_max_body_size 1m;

    # Shared by both routes: the backend needs the original host/scheme
    # for cookies and redirects once this sits behind Cloudflare Tunnel.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API calls go straight to Spring Boot; the browser still sees one
    # origin, so the session cookie works without any CORS setup.
    location /api/ {
        proxy_pass http://backend;

        # Lets /api/ws upgrade to a WebSocket; plain API calls are unaffected.
        # The long read timeout keeps an idle live-queue socket open (STOMP
        # heartbeats every 10s keep it well inside this anyway).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # For the container's own health check: answers from nginx itself, so
    # nginx counts as healthy even while the frontend is restarting.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://frontend;
    }
}
