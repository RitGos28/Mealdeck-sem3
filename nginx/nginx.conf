# The only service with a published port. Everything else (frontend,
# backend, MySQL) is reachable only on the compose network.

# WebSocket upgrade for the live queue (/api/ws): pass the browser's
# Upgrade header through, and send "Connection: upgrade" only when it asked.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # Shared by both routes: the backend needs the original host/scheme
    # for cookies and redirects once this sits behind Cloudflare Tunnel.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API calls go straight to Spring Boot; the browser still sees one
    # origin, so the session cookie works without any CORS setup.
    location /api/ {
        proxy_pass http://backend;

        # Lets /api/ws upgrade to a WebSocket; plain API calls are unaffected.
        # The long read timeout keeps an idle live-queue socket open (STOMP
        # heartbeats every 10s keep it well inside this anyway).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /uploads/ {
        proxy_pass http://backend;
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://frontend;
    }
}
