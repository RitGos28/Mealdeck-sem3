# Test on every push/PR, then redeploy the Docker Compose stack on the
# self-hosted ProLiant runner whenever main changes.
#
# One-time setup on the runner machine: put the production env file (same
# keys as .env.example, real passwords) at ~/mealdeck.env, or point the
# MEALDECK_ENV_FILE repo variable at another path. It lives outside the
# checkout because actions/checkout wipes untracked files on every run.

name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Public repo on a self-hosted runner: never run PRs from forks, since
    # their code would execute on the server.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Backend tests
        working-directory: backend
        # In-memory H2, so CI needs no MySQL. PickupSlotTests already pins
        # this profile; contextLoads would otherwise try the real database.
        env:
          SPRING_PROFILES_ACTIVE: demo
        run: ./mvnw -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint and build
        working-directory: frontend
        # Build too, so a PR that breaks `next build` fails here rather than
        # at deploy time.
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # Never two deploys at once; a newer push queues behind a running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      MEALDECK_ENV_FILE: ${{ vars.MEALDECK_ENV_FILE }}

    steps:
      - uses: actions/checkout@v4

      - name: Locate env file
        run: |
          env_file="${MEALDECK_ENV_FILE:-$HOME/mealdeck.env}"
          if [ ! -f "$env_file" ]; then
            echo "::error::No env file at $env_file. Copy .env.example there on the runner and set real passwords."
            exit 1
          fi
          echo "ENV_FILE=$env_file" >> "$GITHUB_ENV"
          port="$(sed -n 's/^HOST_PORT=//p' "$env_file")"
          echo "HOST_PORT=${port:-80}" >> "$GITHUB_ENV"

      - name: Build and start
        # Fixed project name, so the stack and its mysql_data volume stay the
        # same no matter which directory the runner checks out into.
        # --wait blocks until every healthcheck passes, failing the job if not.
        run: |
          docker compose -p mealdeck --env-file "$ENV_FILE" up -d --build \
            --remove-orphans --wait --wait-timeout 300

      - name: Smoke test
        run: curl -fsS "http://localhost:$HOST_PORT/api/stalls" > /dev/null

      - name: Show logs on failure
        if: failure()
        run: docker compose -p mealdeck --env-file "$ENV_FILE" logs --tail 100

      - name: Remove old images
        if: success()
        run: docker image prune -f
